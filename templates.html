<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning SD Modern</title>
    <!-- Tailwind CSS CDN -->
       <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        .font-friendly { font-family: 'Fredoka', sans-serif; }
        .font-base { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 antialiased flex min-h-screen font-base">

    <!-- 1. SIDEBAR (Friendly & Colorful) -->
    <aside class="w-68 bg-white/80 backdrop-blur-xl border-r border-indigo-100 flex flex-col justify-between hidden md:flex p-4">
        <div>
            <!-- Logo Brand -->
            <div class="p-4 flex items-center gap-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl text-white shadow-lg shadow-indigo-100 mb-6">
                <div class="bg-white/20 p-2 rounded-xl text-white backdrop-blur-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <span class="font-friendly font-bold text-xl tracking-wide">EduKids</span>
            </div>

            <!-- Menu Navigasi -->
            <nav class="space-y-1.5">
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-600 hover:bg-indigo-50/50 hover:text-indigo-600 transition-all font-semibold">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path></svg>
                    Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 text-white font-bold shadow-md shadow-indigo-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Materi Kelas
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-600 hover:bg-purple-50/50 hover:text-purple-600 transition-all font-semibold">
                    <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    Kuis Seru
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-rose-500 hover:bg-rose-50 transition font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Keluar Sistem
                </a>
            </nav>
        </div>

        <!-- Profil Admin Berwarna (Bawah) -->
        <div class="p-3 bg-gradient-to-r from-slate-50 to-indigo-50/30 border border-indigo-100 rounded-2xl flex items-center gap-3 shadow-inner">
            <div class="w-10 h-10 bg-gradient-to-tr from-pink-400 to-purple-500 rounded-xl flex items-center justify-center font-bold text-white shadow-sm">👑</div>
            <div>
                <p class="font-friendly font-bold text-sm text-slate-800 leading-tight">Admin Guru</p>
                <p class="text-xs text-indigo-600 font-medium mt-0.5">Wali Kelas 6-A</p>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 flex flex-col min-w-0">
        
        <!-- 2. TOPBAR HEADER -->
        <header class="h-16 bg-white/60 backdrop-blur-md border-b border-indigo-100/50 px-6 flex items-center justify-between">
            <div class="flex items-center gap-2 text-xs font-bold text-indigo-400/80 tracking-wider uppercase">
                <a href="#" class="hover:text-indigo-600">Home</a>
                <span>/</span>
                <span class="text-purple-600">Materi</span>
            </div>
            <!-- Ikon Navigasi Kanan -->
            <div class="flex items-center gap-3">
                <button class="p-2 bg-white hover:bg-indigo-50 rounded-xl border border-indigo-100 text-indigo-500 shadow-sm transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
                <button class="p-2 bg-white hover:bg-indigo-50 rounded-xl border border-indigo-100 text-purple-500 shadow-sm transition relative"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg><span class="absolute top-2 right-2 w-2.5 h-2.5 bg-rose-500 border-2 border-white rounded-full"></span></button>
            </div>
        </header>

        <!-- AREA KONTEN (Scrollable) -->
        <div class="flex-1 p-6 overflow-y-auto space-y-6">
            
            <!-- 3. KARTU STATISTIK (Colorful & Blurry) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Kartu Materi -->
                <div class="bg-gradient-to-br from-indigo-500 to-indigo-600 p-5 rounded-3xl text-white shadow-xl shadow-indigo-200/50 flex items-center justify-between relative overflow-hidden group">
                    <div class="absolute -right-4 -bottom-4 text-white/10 group-hover:scale-110 transition-transform duration-300"><svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
                    <div class="z-10">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-100/80">Modul Utama</span>
                        <h3 class="font-friendly text-2xl font-bold mt-1">8 Mapel <span class="text-lg font-normal text-indigo-200">/ 10</span></h3>
                        <span class="inline-block bg-white/20 backdrop-blur-sm text-xs font-semibold px-2.5 py-1 rounded-full mt-2">🎉 Sudah Siap!</span>
                    </div>
                </div>
                <!-- Kartu Total Materi -->
                <div class="bg-gradient-to-br from-amber-400 to-orange-500 p-5 rounded-3xl text-white shadow-xl shadow-orange-200/50 flex items-center justify-between relative overflow-hidden group">
                    <div class="absolute -right-4 -bottom-4 text-white/10 group-hover:scale-110 transition-transform duration-300"><svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 2 0 01.707.293l5.414 5.414a1 2 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <div class="z-10">
                        <span class="text-xs font-bold uppercase tracking-wider text-amber-100/80">Dokumen Pendukung</span>
                        <h3 class="font-friendly text-2xl font-bold mt-1">12 Berkas <span class="text-lg font-normal text-amber-100">/ Baru</span></h3>
                        <span class="inline-block bg-white/20 backdrop-blur-sm text-xs font-semibold px-2.5 py-1 rounded-full mt-2">⏳ Butuh Validasi</span>
                    </div>
                </div>
                <!-- Kartu Quiz -->
                <div class="bg-gradient-to-br from-purple-500 to-pink-500 p-5 rounded-3xl text-white shadow-xl shadow-purple-200/50 flex items-center justify-between relative overflow-hidden group">
                    <div class="absolute -right-4 -bottom-4 text-white/10 group-hover:scale-110 transition-transform duration-300"><svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></div>
                    <div class="z-10">
                        <span class="text-xs font-bold uppercase tracking-wider text-purple-100/80">Evaluasi Belajar</span>
                        <h3 class="font-friendly text-2xl font-bold mt-1">4 Sesi <span class="text-lg font-normal text-purple-200">/ Aktif</span></h3>
</div>
</div></div></div></main></body></html>
